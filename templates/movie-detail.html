{% extends "base.html" %}

{% block nav_links %}

{% endblock %}

{% block content %}
<section id="movie-detail-section">
    <!-- Film detayları ve benzer filmler buraya JavaScript tarafından yüklenecek -->
    <div id="detail-content">
        <!-- JavaScript tarafından doldurulacak -->

<div id="trailerModal" class="modal">

        <div id="modal-video-container" class="video-container"></div>

</div>
{% endblock %}

{% block scripts %}

<script src="{{ url_for('static', filename='movie-detail.js') }}"></script>
{% endblock %}
